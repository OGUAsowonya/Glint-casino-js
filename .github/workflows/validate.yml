name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 |
            xargs -0 -n1 node --check

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path . -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count) {
            $errors | ForEach-Object {
              Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
            }
            exit 1
          }

      - name: Run helper mock test
        run: node glint-claimer.mocktest.js

      - name: Validate project JSON
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node -e \
              "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8').replace(/^\uFEFF/, ''))" \
              "$file"
          done < <(find . -type f -name '*.json' -not -path '*/node_modules/*' -print0)
